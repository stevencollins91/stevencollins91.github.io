<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6a00">
  <meta name="description" content="Australian Subbie Calculator for TFN to PTY/ABN, PTY/ABN to TFN and employer charge-out rates, including overtime, super, leave, public holidays, payroll tax and business costs.">

<body>
<div id="app-loading" style="padding:24px;font-family:system-ui,sans-serif">Loading Subbie Calculator…</div>
<script>Promise.all(['base.html','forward.html','reverse.html','employer.html','ending.html'].map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error('Could not load '+f);return r.text()}))).then(parts=>{document.body.innerHTML=parts.join('');const casualHelp=document.querySelector('#fCasual')?.closest('label')?.querySelector('.help');if(casualHelp)casualHelp.textContent='Casual loading is applied to the base hourly rate. Casual status also adjusts paid leave.';const s=document.createElement('script');s.src='app.js';document.body.appendChild(s)}).catch(()=>{document.getElementById('app-loading').textContent='Could not load Subbie Calculator. Please refresh the page.'})</script>
</body>
</html>
